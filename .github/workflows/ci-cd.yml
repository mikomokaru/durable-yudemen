# CI/CD: main への push で CI（lint / typecheck / test）→ 通過後に本番 Cloudflare へデプロイ。
# PR では CI のみ実行し、デプロイはしない。
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一 ref の古い実行はキャンセルし、無駄なデプロイ競合を避ける。
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint / Typecheck / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm を先に用意してから setup-node のキャッシュ（cache: pnpm）を有効化する。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # worker-configuration.d.ts は gitignore のため、型検査前に再生成する（認証不要）。
      - name: Generate Worker types
        run: pnpm cf-typegen

      - name: Lint
        run: pnpm lint

      # 整形崩れは型検査より前に分かった方が速い。oxfmt は .oxfmtrc.json だけを設定の出所とするため、
      # ここでの追加オプションは無い（ローカルの pnpm fmt と同一の判定になる）。
      - name: Format check
        run: pnpm fmt:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  deploy:
    name: Deploy to Cloudflare
    # CI 通過後、かつ main への push のときだけデプロイする（PR ではデプロイしない）。
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Worker types
        run: pnpm cf-typegen

      # assets バインディング（dist）が必要なため、デプロイ前に本番ビルドする。
      # build = tsc --noEmit && vite build。OBSERVE_DEBUG は wrangler.jsonc 既定の "0" のまま。
      - name: Build
        run: pnpm build

      # 本番のみ Access を ON にする。リポジトリ既定（wrangler.jsonc）は ACCESS_REQUIRED="0" を保ち
      # （テスト環境の既定 OFF を壊さない）、本番デプロイ時にのみ実値を --var で注入する（要件5.6）。
      # CI に固定することで「オーバーライドを忘れた素のデプロイが認証を黙って OFF に戻す」footgun を消す。
      # TEAM_DOMAIN / POLICY_AUD は秘匿値ではない（vars 相当）。--var は先頭コロンで key/value 分割ゆえ https:// のコロンは保全される。
      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: "deploy --var ACCESS_REQUIRED:1 --var TEAM_DOMAIN:https://ymoky.cloudflareaccess.com --var POLICY_AUD:c4017121756d26418a54942575babe5c4faf65880e1d9faa2e6c12008741d836"
